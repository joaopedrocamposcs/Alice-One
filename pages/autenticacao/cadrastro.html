<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Alice One</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>
    <main class="pagina">
        <section class="painel" aria-label="Criar conta AliceOne">
            <aside class="apresentacao">
                <p class="marca-nome">AliceOne</p>
                <p class="apresentacao-descricao">Organize seu tempo,<br>conquiste seus objetivos.</p>
                <p class="frase">"Disciplina é o que te leva<br>onde a motivação não leva."</p>
            </aside>

            <section class="cadastro-painel">
                <h1>Criar sua conta</h1>
                <p class="descricao">Comece agora a organizar sua rotina.</p>

                <form class="formulario" action="#" method="post">
                    <div class="campo">
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Nome completo"
                            aria-label="Nome completo"
                            autocomplete="name"
                            required
                        >
                    </div>
                    <div class="campo">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="E-mail"
                            aria-label="E-mail"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <div class="campo">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Senha"
                            aria-label="Senha"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>
                    <div class="campo">
                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Confirmar senha"
                            aria-label="Confirmar senha"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                    <button class="botao botao-cadastrar" type="submit">Cadastrar</button>
                </form>
                <p class="entrar">Já tem uma conta? <a href="login.html">Entrar</a></p>
            </section>
        </section>
    </main>
    <script>
        const senha = document.getElementById('senha');
        const confirmarSenha = document.getElementById('confirmar-senha');

        function validarConfirmacaoSenha() {
            confirmarSenha.setCustomValidity(
                confirmarSenha.value && confirmarSenha.value !== senha.value
                    ? 'As senhas não coincidem.'
                    : ''
            );
        }
        senha.addEventListener('input', validarConfirmacaoSenha);
        confirmarSenha.addEventListener('input', validarConfirmacaoSenha);
    </script>
</body>
</html>
