<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Alice One</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body>
    <main class="pagina">
        <section class="painel" aria-label="Entrar no Alice One">
            <aside class="apresentacao">
                <p class="marca-nome">AliceOne</p>
                <p class="apresentacao-descricao">Organize sua rotina.<br>Conquiste seus objetivos.</p>
                <p class="frase">Mais foco, menos estresse. O Alice One ajuda você a planejar, acompanhar e realizar o que realmente importa.</p>
            </aside>

            <section class="login-painel">
                <header class="login-cabecalho">
                    <h1>Bem-vindo de volta!</h1>
                    <p class="descricao">Faça login para continuar sua jornada.</p>
                </header>

                <form class="formulario" action="#" method="post">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <label class="lembrar">
                        <input type="checkbox" name="lembrar">
                        <span>Lembrar de mim</span>
                    </label>

                    <button class="botao botao-entrar" type="submit">Entrar</button>
                </form>

                <p class="cadastro">
                    Ainda não tem uma conta?
                    <a href="cadrastro.html">Cadastre-se</a>
                </p>
            </section>
        </section>
    </main>
</body>
</html>
