<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d4fc9">
<title>Entrar na sua conta AliceFlow</title>
<meta name="description" content="Entre no AliceFlow para acessar seu painel pessoal de tarefas, calendário, hábitos, metas e anotações.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/login.css">
</head>
<body>
<main class="auth">
<div class="cartao">
<h1>Entrar</h1>
<p>Bem-vindo de volta ao AliceFlow.</p>
<form id="f">
<div class="campo"><label for="email">E-mail</label><input type="email" id="email" name="email" required autocomplete="email"></div>
<div class="campo"><label for="senha">Senha</label><input type="password" id="senha" name="senha" required autocomplete="current-password"></div>
<p class="erro" id="erro" role="alert"></p>
<button class="btn">Entrar</button>
</form>
<p class="troca">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
</div>
<img class="auth-illustration" src="../../assets/auth-background.webp" alt="Ilustração de uma pessoa diante de montanhas sob o céu noturno" width="1600" height="1000" loading="lazy" decoding="async">
</main>
<script src="../../js/storage.js"></script>
<script src="../../js/login.js"></script>
</body>
</html>
