<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d4fc9">
<title>Ajustes da conta | AliceFlow</title>
<meta name="description" content="Gerencie suas preferências, dados e conta pessoal no AliceFlow.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsivo.css">
</head>
<body data-page="configuracoes">
<nav id="nav"></nav>
<main>
<h1 id="titulo">Ajustes</h1>
<form class="box" id="f" style="display:block">
<div class="campo"><label for="nome">Seu nome</label><input type="text" id="nome" name="nome" required></div>
<div class="campo"><label for="tema">Tema</label><select id="tema" name="tema"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Escuro</option></select></div>
<button class="btn">Salvar alterações</button>
<p id="ok" class="empty"></p>
</form>
<div class="box">
<h3>Dados</h3>
<p class="empty">Tudo fica salvo apenas neste navegador.</p>
<button class="btn vazado" id="limpar">Apagar meus dados</button>
<button class="btn perigo" id="excluir">Excluir minha conta</button>
</div>
</main>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/configuracoes.js"></script>
</body>
</html>
